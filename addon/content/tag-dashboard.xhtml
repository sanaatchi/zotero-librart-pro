<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-platform/skin/zotero.css" type="text/css"?>
<!DOCTYPE window [
  <!ENTITY % dialogDTD SYSTEM "chrome://zotero/locale/standalone-dialog.dtd">
  %dialogDTD;
]>
<window
  id="__addonRef__-tag-dashboard-window"
  title="Tag Analysis"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  onload="Zotero.__addonInstance__.hooks.onTagDashboardLoad(window)"
  width="1120"
  height="860"
>
  <html:linkset>
    <html:link
      rel="localization"
      href="__addonRef__-addon.ftl"
    />
  </html:linkset>
  <html:style><![CDATA[
    :root {
      --tag-bg: Field;
      --tag-fg: FieldText;
      --tag-muted: color-mix(in srgb, FieldText 55%, transparent);
      --tag-card: color-mix(in srgb, Field 92%, FieldText 8%);
      --tag-border: color-mix(in srgb, FieldText 14%, transparent);
      --tag-track: color-mix(in srgb, FieldText 10%, transparent);
      --tag-accent: AccentColor;
      --tag-blue: #3b82f6;
      --tag-purple: #8b5cf6;
      --tag-green: #22c55e;
      --tag-orange: #f59e0b;
      --tag-ok: #16a34a;
      --tag-warn: #d97706;
      --tag-info: #2563eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --tag-card: color-mix(in srgb, Field 88%, white 12%);
        --tag-border: color-mix(in srgb, white 16%, transparent);
        --tag-track: color-mix(in srgb, white 12%, transparent);
      }
    }

    #__addonRef__-dashboard-shell {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background: var(--tag-bg);
      color: var(--tag-fg);
      font: message-box;
      font-size: 13px;
      box-sizing: border-box;
    }

    #__addonRef__-dashboard-root {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-sizing: border-box;
    }

    #__addonRef__-dashboard-status {
      padding: 0 24px 16px;
      color: var(--tag-muted);
      font-size: 12px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .muted { color: var(--tag-muted); margin: 0; }
    .small { font-size: 12px; }

    .btn-refresh {
      appearance: none;
      border: 1px solid var(--tag-border);
      background: var(--tag-card);
      color: var(--tag-fg);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }
    .btn-refresh:hover { border-color: var(--tag-accent); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .stat {
      border: 1px solid var(--tag-border);
      border-radius: 8px;
      padding: 14px 14px 12px;
      background: var(--tag-card);
      min-height: 64px;
    }
    .stat-v {
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 4px;
    }
    .stat-l {
      color: var(--tag-muted);
      font-size: 12px;
    }
    .tone-ok .stat-v { color: var(--tag-ok); }
    .tone-warn .stat-v { color: var(--tag-warn); }

    .callout {
      border: 1px solid var(--tag-border);
      border-left-width: 3px;
      border-radius: 8px;
      padding: 12px 14px;
      background: var(--tag-card);
      line-height: 1.45;
    }
    .callout-info { border-left-color: var(--tag-info); }
    .callout-ok { border-left-color: var(--tag-ok); }
    .callout-warn { border-left-color: var(--tag-warn); }

    .divider {
      height: 1px;
      background: var(--tag-border);
      margin: 4px 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      border: 1px solid var(--tag-border);
      border-radius: 8px;
      background: var(--tag-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--tag-border);
      font-weight: 600;
      font-size: 13px;
    }
    .card-b { padding: 14px; }

    .pie-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .donut {
      width: 140px;
      height: 140px;
      flex: 0 0 auto;
    }
    .legend {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend li {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex: 0 0 auto;
    }

    .type-help p {
      margin: 0 0 10px;
      line-height: 1.45;
    }
    .type-help p:last-child { margin-bottom: 0; }

    .vbars {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      min-height: 210px;
      padding: 8px 4px 0;
      overflow-x: auto;
    }
    .vbar {
      flex: 1 1 0;
      min-width: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .vbar-col {
      width: 100%;
      max-width: 28px;
      border-radius: 4px 4px 2px 2px;
      background: var(--tag-blue);
    }
    .vbar-val { font-size: 10px; color: var(--tag-muted); }
    .vbar-lab { font-size: 11px; font-weight: 600; }

    .hbars {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hbar {
      display: grid;
      grid-template-columns: 140px 1fr 48px;
      gap: 10px;
      align-items: center;
    }
    .hbar-lab {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }
    .hbar-track {
      height: 10px;
      border-radius: 999px;
      background: var(--tag-track);
      overflow: hidden;
    }
    .hbar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--tag-purple);
    }
    .hbar-val {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--tag-muted);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .data-table th,
    .data-table td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--tag-border);
    }
    .data-table th {
      color: var(--tag-muted);
      font-weight: 600;
    }
    .data-table td:last-child,
    .data-table th:last-child {
      text-align: right;
      font-variant-numeric: tabular-nums;
      width: 80px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 320px;
      overflow: auto;
    }
    .list-row {
      font-size: 12px;
      line-height: 1.35;
      padding: 2px 0;
    }
    .list-row.fuzzy {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .fuzzy-note { margin: 8px 0 0; }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--tag-track);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .pill-warn {
      background: color-mix(in srgb, var(--tag-warn) 22%, transparent);
      color: var(--tag-warn);
    }

    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-2 { grid-template-columns: 1fr; }
      .hbar { grid-template-columns: 100px 1fr 40px; }
    }
  ]]></html:style>

  <vbox flex="1">
    <html:div id="__addonRef__-dashboard-shell">
      <html:div id="__addonRef__-dashboard-root"></html:div>
      <html:div id="__addonRef__-dashboard-status"></html:div>
    </html:div>
  </vbox>
</window>
