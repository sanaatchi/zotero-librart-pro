<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <title>Tag Analysis</title>
    <script type="application/javascript"><![CDATA[
      window.addEventListener("load", () => {
        try {
          Zotero.ActionsTags.hooks.onTagDashboardLoad(window);
        } catch (e) {
          const root = document.getElementById("zoterotag-dashboard-root");
          if (root) {
            root.textContent = "Tag Analysis failed to load: " + e;
          }
          dump("ActionsTags tag-dashboard load error: " + e + "\n");
        }
      });
    ]]></script>
    <style type="text/css"><![CDATA[
      :root {
        --tag-bg: #f7f7f8;
        --tag-fg: #1c1c1e;
        --tag-muted: #6b6b70;
        --tag-card: #ffffff;
        --tag-border: #e4e4e7;
        --tag-track: #ececef;
        --tag-accent: #2563eb;
        --tag-blue: #3b82f6;
        --tag-purple: #8b5cf6;
        --tag-green: #22c55e;
        --tag-orange: #f59e0b;
        --tag-ok: #16a34a;
        --tag-warn: #d97706;
        --tag-info: #2563eb;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --tag-bg: #1c1c1e;
          --tag-fg: #f2f2f3;
          --tag-muted: #a0a0a6;
          --tag-card: #2a2a2e;
          --tag-border: #3a3a40;
          --tag-track: #3a3a40;
        }
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--tag-bg);
        color: var(--tag-fg);
        font: 13px/1.4 system-ui, Segoe UI, sans-serif;
      }

      #zoterotag-dashboard-shell {
        height: 100%;
        overflow: auto;
        box-sizing: border-box;
      }

      #zoterotag-dashboard-root {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        box-sizing: border-box;
      }

      #zoterotag-dashboard-status {
        padding: 0 24px 16px;
        color: var(--tag-muted);
        font-size: 12px;
      }

      .hero {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .muted { color: var(--tag-muted); margin: 0; }
      .small { font-size: 12px; }

      .btn-refresh {
        appearance: none;
        border: 1px solid var(--tag-border);
        background: var(--tag-card);
        color: var(--tag-fg);
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
        font: inherit;
        white-space: nowrap;
      }
      .btn-refresh:hover { border-color: var(--tag-accent); }
      .btn-refresh:disabled { opacity: 0.6; cursor: default; }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .stat {
        border: 1px solid var(--tag-border);
        border-radius: 8px;
        padding: 14px 14px 12px;
        background: var(--tag-card);
        min-height: 64px;
      }
      .stat-v {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin-bottom: 4px;
      }
      .stat-l {
        color: var(--tag-muted);
        font-size: 12px;
      }
      .tone-ok .stat-v { color: var(--tag-ok); }
      .tone-warn .stat-v { color: var(--tag-warn); }

      .callout {
        border: 1px solid var(--tag-border);
        border-left-width: 3px;
        border-radius: 8px;
        padding: 12px 14px;
        background: var(--tag-card);
        line-height: 1.45;
      }
      .callout-info { border-left-color: var(--tag-info); }
      .callout-ok { border-left-color: var(--tag-ok); }
      .callout-warn { border-left-color: var(--tag-warn); }

      .divider {
        height: 1px;
        background: var(--tag-border);
        margin: 4px 0;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .card {
        border: 1px solid var(--tag-border);
        border-radius: 8px;
        background: var(--tag-card);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .card-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--tag-border);
        font-weight: 600;
        font-size: 13px;
      }
      .card-b { padding: 14px; }

      .pie-wrap {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .donut {
        width: 140px;
        height: 140px;
        flex: 0 0 auto;
      }
      .legend {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .legend li {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex: 0 0 auto;
      }

      .type-help p {
        margin: 0 0 10px;
        line-height: 1.45;
      }
      .type-help p:last-child { margin-bottom: 0; }

      .vbars {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        min-height: 210px;
        padding: 8px 4px 0;
        overflow-x: auto;
      }
      .vbar {
        flex: 1 1 0;
        min-width: 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .vbar-col {
        width: 100%;
        max-width: 28px;
        border-radius: 4px 4px 2px 2px;
        background: var(--tag-blue);
      }
      .vbar-val { font-size: 10px; color: var(--tag-muted); }
      .vbar-lab { font-size: 11px; font-weight: 600; }

      .hbars {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .hbar {
        display: grid;
        grid-template-columns: 140px 1fr 48px;
        gap: 10px;
        align-items: center;
      }
      .hbar-lab {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }
      .hbar-track {
        height: 10px;
        border-radius: 999px;
        background: var(--tag-track);
        overflow: hidden;
      }
      .hbar-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--tag-purple);
      }
      .hbar-val {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        color: var(--tag-muted);
      }

      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .data-table th,
      .data-table td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--tag-border);
      }
      .data-table th {
        color: var(--tag-muted);
        font-weight: 600;
      }
      .data-table td:last-child,
      .data-table th:last-child {
        text-align: right;
        font-variant-numeric: tabular-nums;
        width: 80px;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 320px;
        overflow: auto;
      }
      .list-row {
        font-size: 12px;
        line-height: 1.35;
        padding: 2px 0;
      }
      .list-row.fuzzy {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .fuzzy-note { margin: 8px 0 0; }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--tag-track);
        font-size: 11px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .pill-warn {
        background: color-mix(in srgb, var(--tag-warn) 22%, transparent);
        color: var(--tag-warn);
      }

      @media (max-width: 900px) {
        .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .grid-2 { grid-template-columns: 1fr; }
        .hbar { grid-template-columns: 100px 1fr 40px; }
      }
    ]]></style>
  </head>
  <body>
    <div id="zoterotag-dashboard-shell">
      <div id="zoterotag-dashboard-root">Loading…</div>
      <div id="zoterotag-dashboard-status"></div>
    </div>
  </body>
</html>
