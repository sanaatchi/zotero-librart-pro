<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <title>Safe Import</title>
    <style type="text/css"><![CDATA[
      :root {
        --si-bg: #f7f7f8;
        --si-fg: #1c1c1e;
        --si-muted: #6b6b70;
        --si-border: #e4e4e7;
        --si-accent: #2563eb;
        --si-warn: #d97706;
        --si-bad: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --si-bg: #1c1c1e;
          --si-fg: #f2f2f3;
          --si-muted: #a0a0a6;
          --si-border: #3a3a40;
        }
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--si-bg);
        color: var(--si-fg);
        font: 13px/1.45 system-ui, Segoe UI, sans-serif;
      }
      #librartpro-safe-import-root {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
        padding: 14px;
        gap: 10px;
      }
      h1 { margin: 0; font-size: 18px; }
      .hint { color: var(--si-muted); font-size: 12px; }
      textarea {
        width: 100%;
        min-height: 88px;
        resize: vertical;
        box-sizing: border-box;
        font: inherit;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th, td {
        border-bottom: 1px solid var(--si-border);
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
      }
      th { position: sticky; top: 0; background: var(--si-bg); }
      .scroll {
        flex: 1;
        overflow: auto;
        border: 1px solid var(--si-border);
        border-radius: 6px;
      }
      .warn { color: var(--si-warn); }
      .bad { color: var(--si-bad); }
      #librartpro-safe-import-status { color: var(--si-muted); font-size: 12px; }
    ]]></style>
  </head>
  <body>
    <div id="librartpro-safe-import-root">
      <h1 id="librartpro-safe-import-title">Safe Import</h1>
      <p class="hint" id="librartpro-safe-import-hint"></p>
      <textarea id="librartpro-safe-import-text" placeholder=""></textarea>
      <div class="toolbar">
        <button type="button" id="librartpro-safe-import-file">File…</button>
        <button type="button" id="librartpro-safe-import-parse">Parse</button>
        <button type="button" id="librartpro-safe-import-import" disabled="true">Import selected</button>
        <span id="librartpro-safe-import-status"></span>
      </div>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="librartpro-safe-import-select-all" /></th>
              <th>Title</th>
              <th>Authors</th>
              <th>Year</th>
              <th>ID</th>
              <th>Warnings</th>
            </tr>
          </thead>
          <tbody id="librartpro-safe-import-rows"></tbody>
        </table>
      </div>
    </div>
  </body>
</html>
