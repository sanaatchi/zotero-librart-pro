<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <title>Okuma Panosu</title>
    <style type="text/css"><![CDATA[
      :root {
        --rf-bg: #f7f7f8;
        --rf-fg: #1c1c1e;
        --rf-muted: #6b6b70;
        --rf-card: #ffffff;
        --rf-border: #e4e4e7;
        --rf-accent: #2563eb;
        --rf-warn: #d97706;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --rf-bg: #1c1c1e;
          --rf-fg: #f2f2f3;
          --rf-muted: #a0a0a6;
          --rf-card: #2a2a2e;
          --rf-border: #3a3a40;
        }
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--rf-bg);
        color: var(--rf-fg);
        font: 13px/1.4 system-ui, Segoe UI, sans-serif;
      }

      #librartpro-reading-shell {
        height: 100%;
        overflow: auto;
        box-sizing: border-box;
      }

      #librartpro-reading-root {
        max-width: 880px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      #librartpro-reading-status {
        padding: 0 16px 14px;
        color: var(--rf-muted);
        font-size: 12px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .card {
        background: var(--rf-card);
        border: 1px solid var(--rf-border);
        border-radius: 10px;
        padding: 14px 16px;
      }

      .card-label {
        color: var(--rf-muted);
        font-size: 12px;
        margin-bottom: 6px;
      }

      .card-value {
        font-size: 24px;
        font-weight: 600;
      }

      .panel {
        background: var(--rf-card);
        border: 1px solid var(--rf-border);
        border-radius: 10px;
        padding: 14px 16px;
      }

      .panel h2 {
        margin: 0 0 10px;
        font-size: 14px;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
      }

      .table th,
      .table td {
        padding: 6px 8px;
        border-bottom: 1px solid var(--rf-border);
        text-align: left;
      }

      .table .num {
        text-align: right;
        white-space: nowrap;
      }

      tr.clickable {
        cursor: pointer;
      }

      tr.clickable:hover td {
        background: rgba(37, 99, 235, 0.08);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
      }

      button {
        background: var(--rf-accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
        font: inherit;
      }

      .callout-warn {
        background: rgba(217, 119, 6, 0.12);
        border: 1px solid rgba(217, 119, 6, 0.35);
        border-radius: 8px;
        padding: 12px 14px;
        color: var(--rf-warn);
      }
    ]]></style>
  </head>
  <body>
    <div id="librartpro-reading-shell">
      <div id="librartpro-reading-root"></div>
      <div id="librartpro-reading-status"></div>
    </div>
  </body>
</html>
